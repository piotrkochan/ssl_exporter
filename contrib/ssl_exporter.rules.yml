groups:
  - name: ssl_exporter
    rules:
      - alert: SSLProbeFailed
        expr: ssl_probe_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SSL probe failed for {{ $labels.instance }}"
          description: "ssl_exporter has reported ssl_probe_success=0 for {{ $labels.instance }} for more than 5 minutes."

      - alert: SSLExporterDown
        expr: up{job="ssl"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ssl_exporter is down ({{ $labels.instance }})"
          description: "Prometheus cannot scrape ssl_exporter at {{ $labels.instance }} (up=0) for more than 5 minutes."

      - alert: SSLCertExpired
        expr: |
          ({__name__=~"ssl_.*cert_not_after", __name__!="ssl_verified_cert_not_after"} - time()) <= 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Certificate expired on {{ $labels.instance }}"
          description: "Certificate cn={{ $labels.cn }} (serial {{ $labels.serial_no }}, issuer {{ $labels.issuer_cn }}) for {{ $labels.instance }} has expired."

      - alert: SSLCertExpiringSoon
        expr: |
          (
            ({__name__=~"ssl_.*cert_not_after", __name__!="ssl_verified_cert_not_after"} - time()) < 86400 * 7
            and
            ({__name__=~"ssl_.*cert_not_after", __name__!="ssl_verified_cert_not_after"} - time()) > 0
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Certificate expiring soon on {{ $labels.instance }}"
          description: "Certificate cn={{ $labels.cn }} (serial {{ $labels.serial_no }}) for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."

      - alert: SSLCertRevoked
        expr: ssl_ocsp_response_status == 1 or ssl_ocsp_responder_status == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Certificate revoked on {{ $labels.instance }}"
          description: "The stapled or actively fetched OCSP response for {{ $labels.instance }} reports the certificate as revoked (status=1)."

      - alert: SSLOCSPResponderFailed
        expr: ssl_ocsp_responder_success == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "OCSP responder check failed for {{ $labels.instance }}"
          description: "ssl_exporter could not fetch and parse an OCSP response for {{ $labels.instance }} for more than 10 minutes."

      - alert: SSLOCSPStatusUnknown
        expr: ssl_ocsp_response_status == 2 or ssl_ocsp_responder_status == 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "OCSP status unknown for {{ $labels.instance }}"
          description: "The stapled or actively fetched OCSP response for {{ $labels.instance }} reports an unknown certificate status."

      - alert: SSLOCSPResponseStale
        expr: |
          (
            ssl_ocsp_response_next_update > 0
            and
            ssl_ocsp_response_next_update < time()
          )
          or
          (
            ssl_ocsp_responder_next_update > 0
            and
            ssl_ocsp_responder_next_update < time()
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "OCSP response is stale for {{ $labels.instance }}"
          description: "The OCSP response for {{ $labels.instance }} is past its nextUpdate timestamp."

      - alert: SSLDeprecatedTLSVersion
        expr: ssl_tls_version_info{version=~"TLS 1.0|TLS 1.1"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deprecated TLS version on {{ $labels.instance }}"
          description: "{{ $labels.instance }} negotiated {{ $labels.version }}, which is deprecated."

      - alert: SSLInsecureCipherSuiteNegotiated
        expr: ssl_tls_cipher_suite{insecure="true"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Insecure cipher suite negotiated on {{ $labels.instance }}"
          description: "{{ $labels.instance }} negotiated the insecure cipher suite {{ $labels.cipher_suite }}."

      - alert: SSLInsecureCipherSuiteSupported
        expr: ssl_cipher_suite_supported{insecure="true"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Insecure cipher suite supported on {{ $labels.instance }}"
          description: "{{ $labels.instance }} accepts the insecure cipher suite {{ $labels.cipher_suite }}."
