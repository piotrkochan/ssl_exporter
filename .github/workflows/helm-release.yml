name: Helm Chart Release

on:
  push:
    branches:
      - master
    paths:
      - "charts/**"
      - ".github/workflows/helm-release.yml"

permissions:
  contents: write
  pages: write

jobs:
  helm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'

      - name: Set up Helm
        uses: Azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.18.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.0.3

      - name: Helm lint and unit tests
        run: make helm-test

      - name: Chart-testing lint
        run: ct lint --config ct.yaml --charts charts/ssl-exporter

      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0

      - name: Chart-testing install
        run: ct install --config ct.yaml --charts charts/ssl-exporter

      - name: Verify generated chart assets are up-to-date
        run: |
          make helm-docs
          make manifests
          git diff --exit-code charts/ssl-exporter/README.md deploy/manifests

  release:
    needs: helm-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: Azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.18.1

      - name: Package chart
        run: |
          mkdir -p .helm-packages
          helm package charts/ssl-exporter --destination .helm-packages

      - name: Checkout Helm repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish chart
        run: |
          package="$(basename .helm-packages/*.tgz)"
          if [ -f "gh-pages/${package}" ]; then
            echo "${package} already exists in gh-pages."
            exit 0
          fi

          cp ".helm-packages/${package}" gh-pages/
          cd gh-pages
          helm repo index . --url https://piotrkochan.github.io/ssl_exporter

          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add "${package}" index.yaml
          git commit -m "publish ${package}"
          git push
