name: Helm Chart Release

on:
  push:
    branches:
      - master
    paths:
      - "charts/**"
      - ".github/workflows/helm-release.yml"
  pull_request:
    branches:
      - master
    paths:
      - "charts/**"
      - ".github/workflows/helm-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.0.3

      - name: Helm lint and unit tests
        run: make helm-test

      - name: Chart-testing lint
        run: ct lint --config ct.yaml --charts charts/ssl-exporter

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Chart-testing install
        run: ct install --config ct.yaml --charts charts/ssl-exporter

      - name: Verify generated chart assets are up-to-date
        run: |
          make helm-docs
          make manifests
          git diff --exit-code charts/ssl-exporter/README.md deploy/manifests

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: helm-test
    runs-on: ubuntu-latest
    environment: helm-release
    concurrency:
      group: helm-chart-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.1

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Log in Cosign to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in Helm to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Publish and sign chart
        env:
          CERTIFICATE_IDENTITY: https://github.com/piotrkochan/ssl_exporter/.github/workflows/helm-release.yml@refs/heads/master
          CHART_REGISTRY: ghcr.io/piotrkochan/charts
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          chart_metadata="$(helm show chart charts/ssl-exporter)"
          chart_version="$(printf '%s\n' "$chart_metadata" | awk '$1 == "version:" { print $2 }')"
          app_version="$(printf '%s\n' "$chart_metadata" | awk '$1 == "appVersion:" { print $2 }')"
          chart_tag="${chart_version//+/_}"
          chart_reference="${CHART_REGISTRY}/ssl-exporter:${chart_tag}"

          docker manifest inspect "ghcr.io/piotrkochan/ssl_exporter:${app_version}" >/dev/null

          local_package=".helm-packages/local/ssl-exporter-${chart_version}.tgz"
          remote_package=".helm-packages/remote/ssl-exporter-${chart_version}.tgz"
          mkdir -p .helm-packages/local .helm-packages/remote
          helm package charts/ssl-exporter --destination .helm-packages/local

          chart_existed=false
          if helm show chart "oci://${CHART_REGISTRY}/ssl-exporter" --version "$chart_version" >/dev/null 2>&1; then
            chart_existed=true
            helm_output="$(helm pull "oci://${CHART_REGISTRY}/ssl-exporter" \
              --version "$chart_version" \
              --destination .helm-packages/remote 2>&1)"
            if ! cmp --silent "$local_package" "$remote_package"; then
              echo "Chart ${chart_reference} already exists with different content." >&2
              exit 1
            fi
          else
            helm_output="$(helm push "$local_package" "oci://${CHART_REGISTRY}" 2>&1)"
          fi

          printf '%s\n' "$helm_output"
          chart_digest="$(printf '%s\n' "$helm_output" | sed -n 's/^Digest: *//p')"
          if [[ ! "$chart_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not determine chart digest." >&2
            exit 1
          fi
          digest_reference="${CHART_REGISTRY}/ssl-exporter@${chart_digest}"

          if [[ "$chart_existed" == true ]] && cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$digest_reference" >/dev/null 2>&1; then
            echo "Chart ${chart_reference} has already been published and signed." >&2
            exit 1
          fi

          cosign sign --yes "$digest_reference"
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$digest_reference" >/dev/null
